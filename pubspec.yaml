name: marquee
description: "A shared collaborative watchlist platform for movies."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.2
  http: ^1.6.0
  # Auth0 Universal Login — handles account creation, login, token storage
  # Docs: https://auth0.com/docs/libraries/auth0-flutter
  auth0_flutter: ^1.6.0
  # Image picker — lets users select a profile photo from gallery or camera
  image_picker: ^1.1.2
  # WebSocket client — used for real-time veto game sync
  web_socket_channel: ^3.0.1
  # Cross-platform OAuth browser flow — used for Windows/Linux where auth0_flutter is unsupported
  flutter_web_auth_2: ^4.0.0
  # SHA-256 for PKCE code challenge generation on desktop
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
